<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ContaPyme — Libro contable digital</title>
<link rel="icon" type="image/x-icon" href="ico.ico" />
<style>
  :root{
    --ink:#1C2B22; --muted:#6E7368; --faint:#8A8F86;
    --bg:#F5F4EE; --panel:#FFFFFF; --border:#E1DFD3; --border2:#EDEBE3;
    --sidebar:#1F2E24; --sidebar-hover:#33452F; --sidebar-text:#B8C4B8;
    --gold:#C9A227; --green:#2F6E4F; --green-bg:#EAF3DE;
    --red:#A13D2E; --red-bg:#FAECE7; --amber:#B8860B; --amber-bg:#FBF3DC;
    --grey-bg:#F1EFE8;
  }
  *{box-sizing:border-box; font-family:'Inter','Helvetica Neue',Arial,sans-serif;}
  body{margin:0; padding:24px; background:#EDEBE0;}
  .num{font-family:'Courier New',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  ::placeholder{color:#9CA79C;}
  a, button{-webkit-tap-highlight-color:transparent;}
  button, .nav-btn, .add-btn, .link-btn, .icon-btn, .seg-btn, .reset-btn{transition:background .15s ease, color .15s ease, opacity .15s ease, border-color .15s ease;}
  button:focus-visible, .input:focus-visible, .input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .app{display:flex; min-height:640px; background:var(--bg); border:1px solid var(--border); border-radius:12px; overflow:hidden; max-width:1180px; margin:0 auto; box-shadow:0 1px 3px rgba(28,43,34,.05), 0 12px 32px rgba(28,43,34,.06);}
  .sidebar{width:236px; background:var(--sidebar); padding:20px 14px; display:flex; flex-direction:column; gap:4px;}
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px 20px;}
  .brand-mark{width:34px; height:34px; border-radius:8px; background:var(--gold) url('ico.ico') center/cover no-repeat; color:var(--sidebar); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto;}
  .brand-title{color:var(--bg); font-weight:600; font-size:14.5px; letter-spacing:.01em;}
  .brand-sub{color:#8FA391; font-size:11px;}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-btn{display:flex; align-items:center; gap:10px; padding:9px 10px; background:transparent; border:none; border-radius:7px; color:var(--sidebar-text); font-size:13.5px; text-align:left; cursor:pointer; width:100%;}
  .nav-btn:hover{background:#28352A;}
  .nav-btn.active{background:var(--sidebar-hover); color:var(--bg);}
  .nav-btn svg{flex:0 0 auto;}
  .reset-btn{display:flex; align-items:center; justify-content:center; gap:6px; background:transparent; border:1px solid #3B4C3A; color:#8FA391; font-size:11.5px; padding:8px 10px; border-radius:7px; margin-top:10px; cursor:pointer;}
  .main{flex:1; padding:26px 28px; overflow-y:auto; max-height:90vh;}
  h1.hd{font-size:21px; font-weight:600; color:var(--ink); margin:0; font-family:Georgia,'Times New Roman',serif; letter-spacing:.01em;}
  p.sub{font-size:13.5px; color:var(--muted); margin:4px 0 0;}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .kpi{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:0 1px 2px rgba(28,43,34,.04);}
  .kpi .lbl{font-size:12px; color:var(--faint);}
  .kpi .val{font-size:20px; font-weight:600; margin-top:4px; color:var(--ink);}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:18px; overflow:hidden; box-shadow:0 1px 2px rgba(28,43,34,.04);}
  .panel-head{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--border2); gap:10px; flex-wrap:wrap;}
  .panel-head .note{font-size:13px; color:var(--muted);}
  .stmt-body{padding:16px 18px;}
  .stmt-h{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:18px 0 6px;}
  .stmt-h:first-child{margin-top:0;}
  .stmt-line{display:flex; justify-content:space-between; padding:3px 0; font-size:13.5px; color:var(--ink);}
  .stmt-line .num{color:var(--muted);}
  .stmt-empty{padding:6px 0; font-size:12.5px; color:var(--faint);}
  .stmt-total{display:flex; justify-content:space-between; padding:8px 0; margin-top:4px; border-top:1px solid var(--border2); font-size:14px; font-weight:600;}
  .stmt-total.big{font-size:16px; margin-top:10px; border-top:2px solid var(--border2); padding-top:10px;}
  .stmt-toggle{display:flex; gap:6px; padding:14px 18px 0;}
  .stmt-toggle button{border:1px solid #DAD8CC; background:#fff; border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--muted);}
  .stmt-toggle button.active{background:#1F2E24; color:#fff; border-color:#1F2E24;}
  .add-btn{display:flex; align-items:center; gap:6px; border:none; border-radius:7px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .form-row{display:flex; flex-wrap:wrap; gap:8px; padding:14px 18px; border-bottom:1px solid var(--border2); align-items:center;}
  .input{height:34px; border:1px solid #DAD8CC; border-radius:6px; padding:0 10px; font-size:13px; background:#FBFAF6; flex:1; min-width:100px;}
  select.input{background:#FBFAF6;}
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:9px 18px; font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:var(--faint); border-bottom:1px solid var(--border2); white-space:nowrap;}
  td{padding:10px 18px; border-bottom:1px solid #F3F1E9; color:#2C2C2A;}
  tr:hover td{background:#EEF3EA;}
  .empty-cell{padding:24px 18px; text-align:center; color:var(--faint); font-size:13px;}
  .badge{font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:5px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .badge-danger{color:var(--red); background:var(--red-bg);}
  .badge-warning{color:var(--amber); background:var(--amber-bg);}
  .badge-ok{color:var(--green); background:var(--green-bg);}
  .badge-muted{color:var(--faint); background:var(--grey-bg);}
  .link-btn{border:none; background:transparent; color:#0C447C; font-size:12.5px; font-weight:600; padding:0; cursor:pointer;}
  .icon-btn{border:none; background:transparent; color:#B4B2A9; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:4px;}
  .icon-btn:hover{color:var(--red);}
  .alert-box{display:flex; align-items:center; gap:8px; background:var(--amber-bg); border:1px solid #F0DDA3; border-radius:8px; padding:10px 14px; font-size:13px; color:#7A5A0A; margin-bottom:20px;}
  .segmented{display:flex; gap:4px; background:var(--grey-bg); padding:3px; border-radius:8px;}
  .seg-btn{border:none; background:transparent; padding:6px 14px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--faint); cursor:pointer;}
  .seg-btn.active-venta{background:var(--green-bg); color:var(--green);}
  .seg-btn.active-compra{background:var(--red-bg); color:var(--red);}
  .fact-item-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .fact-item-row .input{flex:2;}
  .fact-item-row .qty{width:90px; flex:none;}
  .fact-item-row .price{width:130px; flex:none;}
  .fact-item-row .sub{width:120px; text-align:right; font-size:13px; color:var(--muted); flex:none;}
  .fact-item-row .hint{font-size:11px; white-space:nowrap; flex:none; width:70px;}
  .fact-totals{display:flex; justify-content:flex-end; gap:24px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border2);}
  .fact-totals .line{font-size:13px; color:var(--muted);}
  .fact-totals .line b{margin-left:8px; color:var(--ink);}
  .fact-totals .grand{font-size:15px; font-weight:600;}
  .checkbox-label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap;}
  .pct-input{display:flex; flex-direction:column; gap:4px;}
  .pct-input .lbl{font-size:12px; color:var(--faint);}
  .pct-input .row{display:flex; align-items:center; gap:4px;}
  .pct-input input{width:80px;}
  .print-overlay{position:fixed; inset:0; background:rgba(28,32,28,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:50; overflow-y:auto;}
  .print-box{background:#fff; width:640px; max-width:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .print-bar{display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border2);}
  .bar-row{margin-bottom:14px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .bar-track{height:8px; background:var(--border2); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}
  .storage-note{font-size:11px; color:#8FA391; padding:8px 10px 0; line-height:1.4;}

  /* ---------------- navegacion movil (hamburguesa + cajon) ---------------- */
  .mobile-topbar{display:none;}
  .nav-backdrop{display:none;}
  .nav-close-btn{display:none;}

  @media (max-width:860px){
    body{padding:0; background:var(--sidebar);}
    .app{flex-direction:column; border-radius:0; border:none; max-width:100%; min-height:100vh; box-shadow:none;}

    .mobile-topbar{
      display:flex; align-items:center; gap:10px; padding:12px 14px;
      background:var(--sidebar); position:sticky; top:0; z-index:30;
      border-bottom:1px solid #2B3A2A;
    }
    .hamburger-btn{
      background:transparent; border:1px solid #3B4C3A; color:var(--bg);
      display:flex; align-items:center; justify-content:center;
      width:38px; height:38px; border-radius:8px; cursor:pointer; flex:0 0 auto; padding:0;
    }
    .hamburger-btn:active{background:#28352A;}
    .mobile-brand{color:var(--bg); font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
    .mobile-brand .brand-mark{width:26px; height:26px; border-radius:6px;}
    .mobile-tab-label{color:#8FA391; font-size:11.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

    .sidebar{
      position:fixed; top:0; left:0; height:100dvh; width:82vw; max-width:300px;
      transform:translateX(-100%); transition:transform .28s ease; z-index:50;
      box-shadow:24px 0 48px rgba(10,16,10,.35); overflow-y:auto; padding-top:16px;
    }
    body.nav-open .sidebar{transform:translateX(0);}
    body.nav-open{overflow:hidden;}
    .nav-backdrop{
      display:block; position:fixed; inset:0; background:rgba(10,14,10,.55);
      opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40;
    }
    body.nav-open .nav-backdrop{opacity:1; pointer-events:auto;}
    .nav-close-btn{
      display:flex; align-items:center; gap:8px; background:transparent; border:none;
      color:#8FA391; font-size:12px; padding:8px 6px; margin:0 0 6px; cursor:pointer; width:100%;
    }

    .main{padding:16px; max-height:none; overflow-y:visible;}
    h1.hd{font-size:18.5px;}
    p.sub{font-size:12.5px;}
    .kpi-grid{grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:16px;}
    .kpi{padding:11px 12px; border-radius:9px;}
    .kpi .val{font-size:17px;}
    .panel{border-radius:10px; margin-bottom:14px;}
    .panel-head{padding:11px 14px;}
    .form-row{padding:12px 14px; gap:8px;}
    .input, select.input{font-size:16px; height:40px; min-width:0; flex:1 1 100%;}
    .form-row .checkbox-label{flex:1 1 100%;}
    .form-row > button.add-btn{flex:1 1 100%; justify-content:center; height:40px;}
    th, td{padding:9px 12px; font-size:12.5px;}
    .table-wrap{-webkit-overflow-scrolling:touch;}
    .icon-btn{padding:8px;}
    .link-btn{padding:6px 0;}
    .print-overlay{padding:0;}
    .print-box{border-radius:0; min-height:100vh;}

    .fact-item-row{flex-wrap:wrap; gap:6px; padding-bottom:8px; border-bottom:1px dashed var(--border2);}
    .fact-item-row select.input{flex:1 1 100% !important; min-width:0 !important;}
    .fact-item-row > input.input{flex:1 1 100%; min-width:0;}
    .fact-item-row .qty{flex:1 1 47%; width:auto;}
    .fact-item-row .price{flex:1 1 47%; width:auto;}
    .fact-item-row .sub{flex:1 1 auto; width:auto; text-align:left;}
    .fact-item-row .hint{flex:0 0 auto;}

    .fact-totals{flex-wrap:wrap; gap:8px 20px; justify-content:flex-start;}
    .stmt-toggle{flex-wrap:wrap;}
    .stmt-toggle button{flex:1 1 auto;}
    .segmented{width:100%;}
    .seg-btn{flex:1;}
  }
  @media (max-width:400px){
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .mobile-tab-label{display:none;}
  }
  @media print{
    .no-print{display:none !important;}
    .print-overlay{position:static !important; background:#fff !important; padding:0 !important;}
    .print-box{box-shadow:none !important; border:none !important; width:100% !important; max-width:100% !important;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>

<div class="app">
  <div class="mobile-topbar no-print">
    <button class="hamburger-btn" onclick="toggleMobileNav()" aria-label="Abrir menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="mobile-brand">
      ContaPyme <span class="mobile-tab-label" id="mobileTabLabel"></span>
    </div>
  </div>
  <div class="nav-backdrop no-print" onclick="toggleMobileNav()"></div>
  <aside class="sidebar no-print">
    <button class="nav-close-btn no-print" onclick="toggleMobileNav()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Cerrar menu
    </button>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">ContaPyme</div>
        <div class="brand-sub">Libro contable digital</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="reset-btn" style="border-color:var(--gold); color:#D9C066;" onclick="exportarRespaldoExcel()">⬇ Respaldar todo a Excel</button>
    <button class="reset-btn" onclick="App.resetAll()">↺ Reiniciar datos de ejemplo</button>
    <button class="reset-btn" onclick="App.clearAll()">🗑 Borrar datos de ejemplo</button>
    <div class="storage-note">Los datos se guardan en el localStorage de este navegador. <br> Si abres el archivo en otro equipo o navegador, no se veran los mismos datos. <br> App desarrollada por Alejandro Chacón</div>
  </aside>
  <main class="main no-print" id="main"></main>
</div>

<div id="printRoot"></div>

<script>
// ---------------- utilidades ----------------
const CRC = (n) => "₡" + Math.round(Number(n) || 0).toLocaleString("es-CR");
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad4 = (n) => String(n).padStart(4,"0");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toggleMobileNav(){ document.body.classList.toggle("nav-open"); }

const ICONS = {

  users:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  truck:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8Z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',

  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  alert:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',

  in:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>',

// ---------------- estado + persistencia ----------------
function loadAll(){
  const data = {};
  for (const key of Object.keys(KEYS)){
    try{
      const raw = localStorage.getItem(KEYS[key]);
      data[key] = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULTS[key]));
    }catch(e){
      data[key] = JSON.parse(JSON.stringify(DEFAULTS[key]));
    }
  }
  if (Array.isArray(data.pla)) data.pla = {config: DEFAULTS.pla.config, empleados: data.pla};
  return data;
}
function saveKey(key, value){
  App.state[key] = value;
  try{ localStorage.setItem(KEYS[key], JSON.stringify(value)); }
  catch(e){ console.error("No se pudo guardar", key, e); }
}

    if (!confirm("¿Restaurar los datos de ejemplo? Se perderan los cambios guardados.")) return;
    for (const key of Object.keys(KEYS)) localStorage.removeItem(KEYS[key]);
    this.state = loadAll();

    if (!confirm("¿Borrar los datos de ejemplo? Se eliminaran clientes, proveedores, facturas, cuentas por cobrar/pagar, inventario, planillas, precios de venta, activos, bancos y asientos contables. El catalogo de cuentas y la configuracion contable se conservan tal como estan.")) return;
    const vacio = {
      cli: [], prov: [], cxc: [], cxp: [],
      inv: {productos:[], movimientos:[]},
      pla: {config: this.state.pla.config, empleados:[]},

    for (const key of Object.keys(vacio)) saveKey(key, vacio[key]);

    document.getElementById("nav").innerHTML = TABS.map(t =>
      `<button class="nav-btn ${this.tab===t.id?'active':''}" onclick="App.goto('${t.id}')">${ICONS[t.icon]}${t.label}</button>`
    ).join("");
    const mobileLabel = document.getElementById("mobileTabLabel");
    if (mobileLabel){
      const t = TABS.find(t=>t.id===this.tab);
      mobileLabel.textContent = t ? "· " + t.label : "";
    }

    const main = document.getElementById("main");
    if (this.tab==="resumen") main.innerHTML = renderResumen(this.state);
    else if (this.tab==="fac") main.innerHTML = renderFacturas(this.state);
    else if (this.tab==="cli") main.innerHTML = renderDirectorio(this.state.cli, "cliente");
    else if (this.tab==="prov") main.innerHTML = renderDirectorio(this.state.prov, "proveedor");
    else if (this.tab==="cxc") main.innerHTML = renderCuentas(this.state.cxc, "cliente", "cxc");
    else if (this.tab==="cxp") main.innerHTML = renderCuentas(this.state.cxp, "proveedor", "cxp");
    else if (this.tab==="inv") main.innerHTML = renderInventario(this.state.inv);
    else if (this.tab==="pla") main.innerHTML = renderPlanillas(this.state.pla);
    else if (this.tab==="pre") main.innerHTML = renderPrecios(this.state);
    else if (this.tab==="dep") main.innerHTML = renderDepreciacion(this.state.dep);
    else if (this.tab==="ban") main.innerHTML = renderBancos(this.state);
    else if (this.tab==="cat") main.innerHTML = renderCatalogo(this.state);
    else if (this.tab==="asi") main.innerHTML = renderAsientos(this.state);
    else if (this.tab==="may") main.innerHTML = renderMayor(this.state);
    else if (this.tab==="efi") main.innerHTML = renderEstados(this.state);

  // ---- directorio de clientes / proveedores ----
  ensureCliente({nombre, identificacion}){
    if (!nombre) return null;
    let c = this.state.cli.find(c => c.nombre.toLowerCase()===nombre.toLowerCase());
    if (!c){
      c = {id:uid(), nombre, identificacion: identificacion||"", telefono:"", email:"", notas:""};
      saveKey("cli", [...this.state.cli, c]);
    }
    return c;
  },
  ensureProveedor({nombre, identificacion}){
    if (!nombre) return null;
    let p = this.state.prov.find(p => p.nombre.toLowerCase()===nombre.toLowerCase());
    if (!p){
      p = {id:uid(), nombre, identificacion: identificacion||"", telefono:"", email:"", notas:""};
      saveKey("prov", [...this.state.prov, p]);
    }
    return p;
  },
  addDirectorio(kind){
    const key = kind==="cliente" ? "cli" : "prov";
    const g = (id) => document.getElementById(id).value.trim();
    const nombre = g(key+"-nombre");
    if (!nombre) { alert("El nombre es obligatorio."); return; }
    const entidad = {id:uid(), nombre, identificacion:g(key+"-id"), telefono:g(key+"-tel"), email:g(key+"-email"), notas:""};
    saveKey(key, [...this.state[key], entidad]);
    this.render();
  },
  removeDirectorio(kind, id){
    const key = kind==="cliente" ? "cli" : "prov";
    if (!confirm(`¿Eliminar este ${kind}? No se borran las facturas o cuentas ya creadas.`)) return;
    saveKey(key, this.state[key].filter(e=>e.id!==id));
    this.render();
  },
  setEntidadCuenta(kind, id, cuentaId){
    const key = kind==="cliente" ? "cli" : "prov";
    saveKey(key, this.state[key].map(e => e.id===id ? {...e, cuentaId} : e));
  },

  // ---- catalogo de cuentas ----
  addCuentaCatalogo(){
    const g = (id) => document.getElementById(id).value.trim();
    const codigo = g("cat-codigo");
    const nombre = g("cat-nombre");
    const tipo = document.getElementById("cat-tipo").value;
    const padreId = document.getElementById("cat-padre").value;
    const esDetalle = document.getElementById("cat-detalle").checked;
    if (!codigo || !nombre) { alert("Completa codigo y nombre de la cuenta."); return; }
    if (this.state.cat.some(c=>c.codigo===codigo)) { alert("Ya existe una cuenta con ese codigo."); return; }
    const naturaleza = (tipo==="Activo"||tipo==="Costo"||tipo==="Gasto") ? "Deudora" : "Acreedora";
    saveKey("cat", [...this.state.cat, {id:uid(), codigo, nombre, tipo, naturaleza, padreId, esDetalle}]);
    this.render();
  },
  removeCuentaCatalogo(id){
    const enUso = this.state.cli.some(c=>c.cuentaId===id) || this.state.prov.some(p=>p.cuentaId===id)
      || this.state.ban.some(b=>b.cuentaId===id)
      || this.state.inv.productos.some(p=>p.cuentaInventarioId===id||p.cuentaVentaId===id||p.cuentaCostoId===id)
      || Object.values(this.state.cfg).includes(id)
      || this.state.cat.some(c=>c.padreId===id);
    if (enUso && !confirm("Esta cuenta esta en uso (asignada a un banco, cliente, proveedor, producto, otra cuenta padre o en la configuracion contable). ¿Eliminarla de todas formas?")) return;
    if (!enUso && !confirm("¿Eliminar esta cuenta del catalogo?")) return;

  // ---- cuentas por cobrar / pagar ----
  toggleCuentaForm(key){
    if (key==="cxc") this.cxcShowForm = !this.cxcShowForm; else this.cxpShowForm = !this.cxpShowForm;
    this.render();
  },
  addCuenta(key){
    const kind = key==="cxc" ? "cliente" : "proveedor";
    const g = (id) => document.getElementById(id).value;
    const entidad = resolveEntidad(key+"-ent", kind);
    const monto = Number(g(key+"-monto"));
    if (!entidad || !monto) { alert(`Selecciona o agrega un ${kind} y un monto valido.`); return; }
    const cuentaId = entidad.cuentaId || (key==="cxc" ? this.state.cfg.cuentaCxCDefault : this.state.cfg.cuentaCxPDefault);
    const row = {
      id: uid(), nombre: entidad.nombre, identificacion: entidad.identificacion || "", fecha: g(key+"-fecha") || todayISO(),
      plazoDias: Number(g(key+"-plazo")) || 0, factura: g(key+"-factura"), monto, abonado: 0, cuentaId,
    };
    saveKey(key, [...this.state[key], row]);
    if (key==="cxc") this.cxcShowForm=false; else this.cxpShowForm=false;
    this.render();
  },
  removeCuenta(key, id){
    if (!confirm("¿Eliminar este registro?")) return;
    saveKey(key, this.state[key].filter(r => r.id !== id));
    this.render();
  },
  toggleAbono(key, id){
    if (this.abonoTarget && this.abonoTarget.key===key && this.abonoTarget.id===id) this.abonoTarget = null;
    else this.abonoTarget = {key, id};
    this.render();
  },
  cancelarAbono(){ this.abonoTarget = null; this.render(); },
  confirmarAbono(){
    const target = this.abonoTarget;
    if (!target) return;
    const {key, id} = target;
    const monto = Number(document.getElementById("abono-monto").value);
    const bancoId = document.getElementById("abono-banco").value;
    if (!monto || monto<=0) { alert("Ingresa un monto valido."); return; }
    if (!bancoId) { alert("Selecciona la cuenta de pago (banco, caja, tarjeta o SINPE)."); return; }
    const banco = this.state.ban.find(b=>b.id===bancoId);
    const row = this.state[key].find(r=>r.id===id);
    if (!row || !banco) return;
    saveKey(key, this.state[key].map(r => r.id===id ? {...r, abonado:(Number(r.abonado)||0)+monto} : r));
    const cuentaEntidad = row.cuentaId || (key==="cxc" ? this.state.cfg.cuentaCxCDefault : this.state.cfg.cuentaCxPDefault);
    const glosa = `Abono ${key==="cxc"?"recibido de":"pagado a"} ${row.nombre}${row.factura?` - ${row.factura}`:""} (${banco.nombre})`;
    const detalle = key==="cxc"
      ? [{cuentaId: banco.cuentaId, debe: monto, haber: 0}, {cuentaId: cuentaEntidad, debe: 0, haber: monto}]
      : [{cuentaId: cuentaEntidad, debe: monto, haber: 0}, {cuentaId: banco.cuentaId, debe: 0, haber: monto}];
    this.registrarAsiento({fecha: todayISO(), origen: key==="cxc"?"abono-cxc":"abono-cxp", referencia: row.factura||"", glosa, tipo:"automatico", detalle});
    this.abonoTarget = null;
    this.render();
  },

  // ---- inventario ----
  addProductoNuevo(){
    const nombre = document.getElementById("invnew-nombre").value.trim();
    const existencia = Number(document.getElementById("invnew-existencia").value)||0;
    const costoUnitario = Number(document.getElementById("invnew-costo").value)||0;
    if (!nombre){ alert("Escribe el nombre del producto."); return; }
    if (this.state.inv.productos.some(p=>p.nombre.toLowerCase()===nombre.toLowerCase())){ alert("Ya existe un producto con ese nombre."); return; }
    const nuevo = {id:uid(), codigo: nombre.slice(0,3).toUpperCase(), nombre, existencia, costoUnitario};
    const movimientos = [...this.state.inv.movimientos];
    if (existencia>0){
      movimientos.unshift({id:uid(), fecha:todayISO(), producto:nombre, tipo:"entrada", cantidad:existencia, costoUnitario, factura:"", proveedor:"Alta manual"});
    }
    saveKey("inv", {productos:[...this.state.inv.productos, nuevo], movimientos: movimientos.slice(0,30)});
    this.render();

  registrarMovimiento(){
    const productoId = document.getElementById("inv-producto").value;
    const tipo = document.getElementById("inv-tipo").value;
    const cantidad = Number(document.getElementById("inv-cantidad").value);
    const costoInput = document.getElementById("inv-costo");
    const costoUnitario = costoInput ? Number(costoInput.value) : null;
    const prod = this.state.inv.productos.find(p => p.id===productoId);
    if (!prod || !cantidad) { alert("Selecciona un producto y una cantidad valida."); return; }
    let productos;
    if (tipo==="entrada"){
      const costoNuevo = costoUnitario || prod.costoUnitario;
      const existenciaNueva = prod.existencia + cantidad;
      const costoPromedio = existenciaNueva>0 ? (prod.existencia*prod.costoUnitario + cantidad*costoNuevo)/existenciaNueva : costoNuevo;
      productos = this.state.inv.productos.map(p => p.id===prod.id ? {...p, existencia:existenciaNueva, costoUnitario:costoPromedio} : p);
    } else {
      const existenciaNueva = Math.max(0, prod.existencia - cantidad);
      productos = this.state.inv.productos.map(p => p.id===prod.id ? {...p, existencia:existenciaNueva} : p);
    }
    const proveedor = tipo==="entrada" ? resolveEntidad("inv-ent", "proveedor") : null;
    const mov = {id:uid(), fecha:todayISO(), producto:prod.nombre, tipo, cantidad, costoUnitario: costoUnitario||prod.costoUnitario, proveedor: proveedor?proveedor.nombre:""};
    saveKey("inv", {productos, movimientos:[mov, ...this.state.inv.movimientos].slice(0,30)});

    if (!glosa) { alert("Escribe una glosa / descripcion para el asiento."); return; }

  },
  removeFacturaItem(idx){
    const row = document.getElementById("fitem-"+idx);

  },
  crearFactura(){
    const tipo = this.facturaTipo;
    const kind = tipo==="venta" ? "cliente" : "proveedor";
    const entidad = resolveEntidad("fac-ent", kind);
    const fecha = document.getElementById("fac-fecha").value || todayISO();
    const condicion = document.getElementById("fac-condicion").value;
    const plazoDiasEl = document.getElementById("fac-plazo");
    const plazoDias = plazoDiasEl ? Number(plazoDiasEl.value)||0 : 0;
    const incluirIva = document.getElementById("fac-iva").checked;

    let banco = null;
    if (condicion === "contado"){
      const bancoSel = document.getElementById("fac-banco");
      banco = bancoSel ? this.state.ban.find(b=>b.id===bancoSel.value) : null;
      if (!banco){ alert("Selecciona la cuenta de pago (caja, banco, tarjeta o SINPE)."); return; }
    }

    const rows = document.querySelectorAll("#factura-items .fact-item-row");
    const items = [];
    rows.forEach(row => {
      const idx = row.dataset.idx;
      const nombre = document.getElementById("fitem-nombre-"+idx).value.trim();
      const cantidad = Number(document.getElementById("fitem-cant-"+idx).value);
      const precioUnitario = Number(document.getElementById("fitem-precio-"+idx).value);
      if (nombre && cantidad>0) items.push({nombre, cantidad, precioUnitario: precioUnitario||0});
    });

    if (!entidad || items.length===0){
      alert(`Selecciona o agrega un ${kind} y al menos una linea con producto y cantidad.`);
      return;
    }
    const contraparte = entidad.nombre;
    const identificacion = entidad.identificacion || "";
    let productos = this.state.inv.productos.map(p=>({...p}));
    const movimientos = [...this.state.inv.movimientos];
    const numero = (tipo==="venta"?"V-":"C-") + pad4(this.state.fac.filter(f=>f.tipo===tipo).length + 1);
    const avisos = [];

    const itemsResueltos = items.map(it => {
      let prod = productos.find(p => p.nombre.toLowerCase()===it.nombre.toLowerCase());
      let costoUnitarioAlMomento = null;
      if (tipo==="venta"){
        if (!prod){
          avisos.push(`"${it.nombre}" no esta en el inventario; se facturo sin descontar existencia.`);
        } else {
          if (prod.existencia < it.cantidad) avisos.push(`Existencia insuficiente de "${prod.nombre}" (quedo en negativo).`);
          costoUnitarioAlMomento = prod.costoUnitario;
          prod.existencia = prod.existencia - it.cantidad;
          movimientos.unshift({id:uid(), fecha, producto:prod.nombre, tipo:"salida", cantidad:it.cantidad, costoUnitario:prod.costoUnitario, factura:numero});
        }
      } else {
        if (!prod){
          prod = {id:uid(), codigo: it.nombre.slice(0,3).toUpperCase(), nombre: it.nombre, existencia:0, costoUnitario: it.precioUnitario};
          productos.push(prod);
        }
        const existenciaNueva = prod.existencia + it.cantidad;
        prod.costoUnitario = existenciaNueva>0 ? (prod.existencia*prod.costoUnitario + it.cantidad*it.precioUnitario)/existenciaNueva : it.precioUnitario;
        prod.existencia = existenciaNueva;
        movimientos.unshift({id:uid(), fecha, producto:prod.nombre, tipo:"entrada", cantidad:it.cantidad, costoUnitario:it.precioUnitario, factura:numero});
      }
      return {
        nombre:it.nombre, cantidad:it.cantidad, precioUnitario:it.precioUnitario, subtotal: it.cantidad*it.precioUnitario,
        cuentaInventarioId: prod ? prod.cuentaInventarioId : null,
        cuentaVentaId: prod ? prod.cuentaVentaId : null,
        cuentaCostoId: prod ? prod.cuentaCostoId : null,
        costoUnitarioAlMomento,
      };
    });

    const subtotal = itemsResueltos.reduce((s,i)=>s+i.subtotal,0);
    const iva = incluirIva ? subtotal*0.13 : 0;
    const total = subtotal + iva;
    const factura = {id:uid(), numero, tipo, contraparte, identificacion, fecha, condicion, plazoDias, incluirIva, items:itemsResueltos, subtotal, iva, total};

    productos = productos.map(p => ({...p, existencia: Math.round(p.existencia*1000)/1000, costoUnitario: Math.round(p.costoUnitario*100)/100}));

    saveKey("fac", [factura, ...this.state.fac]);
    saveKey("inv", {productos, movimientos: movimientos.slice(0,30)});

    const cuentaCxCoCxP = entidad.cuentaId || (tipo==="venta" ? this.state.cfg.cuentaCxCDefault : this.state.cfg.cuentaCxPDefault);
    if (condicion==="credito"){
      const nuevaCuenta = {id:uid(), nombre:contraparte, identificacion, fecha, plazoDias, factura:numero, monto:total, abonado:0, cuentaId: cuentaCxCoCxP};
      if (tipo==="venta") saveKey("cxc", [...this.state.cxc, nuevaCuenta]);
      else saveKey("cxp", [...this.state.cxp, nuevaCuenta]);
    }

    const detalleAsiento = construirDetalleFactura(factura, itemsResueltos, this.state.cfg, banco?banco.cuentaId:null, cuentaCxCoCxP);
    const metodoTxt = banco ? ` (${banco.nombre})` : "";
    this.registrarAsiento({
      fecha, origen: tipo==="venta" ? "factura-venta" : "factura-compra", referencia: numero,
      glosa: `Factura ${numero} - ${contraparte}${metodoTxt}`, tipo: "automatico", detalle: detalleAsiento,
    });

    this.facturaAvisos = avisos;
    this.facturaOk = `Factura ${numero} creada por ${CRC(total)}.`;
    this.facturaItemIdx = 0;
    this.render();
  },

  printFactura(id){
    const f = this.state.fac.find(x=>x.id===id);
    if (!f) return;
    document.getElementById("printRoot").innerHTML = printModalHTML(f);
  },
  closePrint(){
    document.getElementById("printRoot").innerHTML = "";
  },
};

function selectorEntidadHTML(prefix, kind, selectedId){
  const list = kind==="cliente" ? App.state.cli : App.state.prov;
  const label = kind==="cliente" ? "cliente" : "proveedor";
  return `
    <select class="input" id="${prefix}-select" style="min-width:170px" onchange="onEntidadSelectChange('${prefix}')">
      <option value="">Seleccionar ${label}...</option>
      ${list.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${esc(c.nombre)}</option>`).join("")}
      <option value="__new__">+ Agregar nuevo ${label}</option>
    </select>
    <span id="${prefix}-new-fields" style="display:none; gap:8px;">
      <input class="input" id="${prefix}-new-nombre" placeholder="Nombre" style="width:150px" />
      <input class="input" id="${prefix}-new-id" placeholder="Cedula/ID" style="width:110px" />
    </span>`;
}
function onEntidadSelectChange(prefix){
  const sel = document.getElementById(prefix+"-select");
  const nf = document.getElementById(prefix+"-new-fields");
  if (nf) nf.style.display = sel.value==="__new__" ? "inline-flex" : "none";
}
function resolveEntidad(prefix, kind){
  const sel = document.getElementById(prefix+"-select");
  if (!sel) return null;
  if (sel.value==="__new__"){
    const nombre = (document.getElementById(prefix+"-new-nombre").value||"").trim();
    const identificacion = (document.getElementById(prefix+"-new-id").value||"").trim();
    if (!nombre) return null;
    return kind==="cliente" ? App.ensureCliente({nombre, identificacion}) : App.ensureProveedor({nombre, identificacion});
  } else if (sel.value){
    const list = kind==="cliente" ? App.state.cli : App.state.prov;
    return list.find(c=>c.id===sel.value) || null;
  }
  return null;
}

// saldo (debe-haber, segun naturaleza) de una cuenta a partir de los asientos contables.
// Si se pasa "asientos", se usa esa lista filtrada; si no, se usa el diario completo del estado.
function saldoCuenta(cuentaId, state, asientos){
  const cuenta = state.cat.find(c=>c.id===cuentaId);
  if (!cuenta) return 0;
  let debe = 0, haber = 0;
  (asientos || state.asi || []).forEach(a => a.detalle.forEach(l => {
    if (l.cuentaId===cuentaId){ debe += Number(l.debe)||0; haber += Number(l.haber)||0; }
  }));
  return cuenta.naturaleza==="Deudora" ? (debe-haber) : (haber-debe);
}
function saldosPorTipo(tipo, state, asientos){
  return state.cat.filter(c=>c.esDetalle && c.tipo===tipo)
    .map(c=>({cuenta:c, saldo: saldoCuenta(c.id, state, asientos)}))
    .filter(x=>Math.round(x.saldo*100)!==0)
    .sort((a,b)=>a.cuenta.codigo.localeCompare(b.cuenta.codigo));
}
function saldoBanco(banco, state){
  return (Number(banco.saldoInicial)||0) + saldoCuenta(banco.cuentaId, state);
}
function selectorBancoHTML(id, selectedId, opts){
  opts = opts || {};
  const placeholder = opts.placeholder || "Cuenta de pago...";
  const bancos = App.state.ban;
  return `<select class="input" id="${id}" style="${opts.style||'min-width:170px'}" ${opts.onchange?`onchange="${opts.onchange}"`:""}>
    <option value="">${esc(placeholder)}</option>
    ${bancos.map(b=>`<option value="${b.id}" ${selectedId===b.id?'selected':''}>${esc(b.nombre)} (${esc(b.tipo)})</option>`).join("")}
  </select>`;
}
// ---------------- helpers de asientos contables ----------------
function mergeDetalleAsiento(lineas){
  const map = {};
  lineas.forEach(l => {
    if (!l.cuentaId) return;
    if (!map[l.cuentaId]) map[l.cuentaId] = {cuentaId:l.cuentaId, debe:0, haber:0};
    map[l.cuentaId].debe += Number(l.debe)||0;
    map[l.cuentaId].haber += Number(l.haber)||0;
  });
  return Object.values(map)
    .map(l => ({cuentaId:l.cuentaId, debe:Math.round(l.debe*100)/100, haber:Math.round(l.haber*100)/100}))
    .filter(l => l.debe!==0 || l.haber!==0);
}
function construirDetalleFactura(factura, itemsResueltos, cfg, bancoCuentaId, cuentaCxCoCxP){
  const detalle = [];
  if (factura.tipo === "venta"){
    if (factura.condicion === "contado") detalle.push({cuentaId: bancoCuentaId, debe: factura.total, haber: 0});
    else detalle.push({cuentaId: cuentaCxCoCxP, debe: factura.total, haber: 0});

    itemsResueltos.forEach(it => {
      detalle.push({cuentaId: it.cuentaVentaId || cfg.cuentaVentasDefault, debe: 0, haber: it.subtotal});
    });
    if (factura.iva > 0) detalle.push({cuentaId: cfg.cuentaIvaVentas, debe: 0, haber: factura.iva});

    itemsResueltos.forEach(it => {
      if (it.costoUnitarioAlMomento != null){
        const montoCosto = it.cantidad * it.costoUnitarioAlMomento;
        detalle.push({cuentaId: it.cuentaCostoId || cfg.cuentaCostoDefault, debe: montoCosto, haber: 0});
        detalle.push({cuentaId: it.cuentaInventarioId || cfg.cuentaInventarioDefault, debe: 0, haber: montoCosto});
      }
    });
  } else {
    itemsResueltos.forEach(it => {
      detalle.push({cuentaId: it.cuentaInventarioId || cfg.cuentaInventarioDefault, debe: it.subtotal, haber: 0});
    });
    if (factura.iva > 0) detalle.push({cuentaId: cfg.cuentaIvaCompras, debe: factura.iva, haber: 0});
    if (factura.condicion === "contado") detalle.push({cuentaId: bancoCuentaId, debe: 0, haber: factura.total});
    else detalle.push({cuentaId: cuentaCxCoCxP, debe: 0, haber: factura.total});
  }
  return detalle;
}

      <input class="input price" id="asiline-debe-${idx}" type="number" placeholder="Debe" value="${line.debe||''}" oninput="onAsientoLineInput()" />
      <input class="input price" id="asiline-haber-${idx}" type="number" placeholder="Haber" value="${line.haber||''}" oninput="onAsientoLineInput()" />

function asientoLinesInitialHTML(existing){
  if (existing && existing.length) return existing.map((l,i)=>asientoLineRowHTML(i, l)).join("");
  return asientoLineRowHTML(0,{}) + asientoLineRowHTML(1,{});
}
function onAsientoLineInput(){
  let debe = 0, haber = 0;
  document.querySelectorAll("#asiento-lines .fact-item-row").forEach(row => {
    const idx = row.dataset.idx;
    debe += Number(document.getElementById("asiline-debe-"+idx).value)||0;
    haber += Number(document.getElementById("asiline-haber-"+idx).value)||0;
  });
  const d = document.getElementById("asi-total-debe"), h = document.getElementById("asi-total-haber"), diff = document.getElementById("asi-diferencia");
  if (d) d.textContent = CRC(debe);
  if (h) h.textContent = CRC(haber);
  if (diff) diff.textContent = "Diferencia " + CRC(debe-haber);
}
// ---------------- helper de precio de venta automatico ----------------
function precioVentaCalculado(prod, pre){
  const ci = prod.costoUnitario*pre.pctIndirectos, gf = prod.costoUnitario*pre.pctFijos, ut = prod.costoUnitario*pre.pctUtilidad;
  return prod.costoUnitario + ci + gf + ut;
}

// ---------------- calculo compartido cuentas ----------------
function estadoCuenta(row){
  const saldo = (Number(row.monto)||0) - (Number(row.abonado)||0);
  if (saldo<=0) return {label:"Cancelada", tone:"muted", saldo};
  const venc = new Date(row.fecha);
  venc.setDate(venc.getDate() + (Number(row.plazoDias)||0));
  const dias = daysBetween(todayISO(), venc.toISOString().slice(0,10));
  if (dias<0) return {label:`Vencida hace ${Math.abs(dias)}d`, tone:"danger", saldo, dias};
  if (dias<=7) return {label:`Vence en ${dias}d`, tone:"warning", saldo, dias};
  return {label:`Vigente (${dias}d)`, tone:"ok", saldo, dias};
}

// ---------------- render: resumen ----------------
function renderResumen(state){
  const cxcTotal = state.cxc.reduce((s,r)=>s+Math.max((r.monto||0)-(r.abonado||0),0),0);
  const cxpTotal = state.cxp.reduce((s,r)=>s+Math.max((r.monto||0)-(r.abonado||0),0),0);
  const cxcVencido = state.cxc.filter(r=>estadoCuenta(r).tone==="danger").reduce((s,r)=>s+Math.max((r.monto||0)-(r.abonado||0),0),0);
  const cxpVencido = state.cxp.filter(r=>estadoCuenta(r).tone==="danger").reduce((s,r)=>s+Math.max((r.monto||0)-(r.abonado||0),0),0);
  const invValor = state.inv.productos.reduce((s,p)=>s+p.existencia*p.costoUnitario,0);
  const depValorLibros = state.dep.reduce((s,a)=>{
    const meses = Math.min(Math.max(0, Math.floor(daysBetween(a.fechaCompra, todayISO())/30)), a.vidaUtilMeses);
    const acumulada = (a.costoHistorico/a.vidaUtilMeses)*meses;
    return s + (a.costoHistorico - acumulada);
  },0);
  const planillaMensual = state.pla.empleados.reduce((s,e)=>s+e.salarioMensual,0);
  const ventasTotal = state.fac.filter(f=>f.tipo==="venta").reduce((s,f)=>s+f.total,0);
  const activos = cxcTotal + invValor + depValorLibros;
  const max = Math.max(cxcTotal, cxpTotal, 1);
  const alertHTML = (cxcVencido>0 || cxpVencido>0) ? `
    <div class="alert-box">${ICONS.alert}<span>
      ${cxcVencido>0?`Tienes ${CRC(cxcVencido)} en cuentas por cobrar vencidas. `:""}
      ${cxpVencido>0?`Tienes ${CRC(cxpVencido)} en cuentas por pagar vencidas.`:""}
    </span></div>` : "";

  return `
    ${header("Panorama general","Vista consolidada, calculada en vivo a partir de facturas, inventario y cuentas")}
    <div class="kpi-grid">
      ${kpi("Por cobrar", CRC(cxcTotal), "#2F6E4F")}
      ${kpi("Por pagar", CRC(cxpTotal), "#A13D2E")}
      ${kpi("Valor de inventario", CRC(invValor))}
      ${kpi("Facturado en ventas", CRC(ventasTotal))}
    </div>
    <div class="panel">
      <div class="panel-head"><span class="note">Cobrar vs. pagar</span></div>
      <div style="padding:4px 20px 20px;">
        ${barRow("Por cobrar", cxcTotal, max, "#2F6E4F")}
        ${barRow("Por pagar", cxpTotal, max, "#A13D2E")}
      </div>
    </div>
    ${alertHTML}
    <div class="kpi-grid">
      ${kpi("Activos estimados", CRC(activos))}
      ${kpi("Planilla mensual", CRC(planillaMensual))}
    </div>
  `;
}
function barRow(label, value, max, color){
  const pct = Math.min(100, (value/max)*100);
  return `<div class="bar-row">
    <div class="top"><span style="color:var(--muted)">${label}</span><span class="num" style="font-weight:600">${CRC(value)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
  </div>`;
}

// ---------------- render: cuentas por cobrar / pagar ----------------
function renderCuentas(rows, kind, key){
  const enriched = rows.map(r=>({...r, ...estadoCuenta(r)})).sort((a,b)=>(a.dias??-9999)-(b.dias??-9999));
  const totalCartera = rows.reduce((s,r)=>s+(Number(r.monto)||0),0);
  const totalSaldo = enriched.reduce((s,r)=>s+Math.max(r.saldo,0),0);
  const totalVencido = enriched.filter(r=>r.tone==="danger").reduce((s,r)=>s+Math.max(r.saldo,0),0);
  const cantVencidas = enriched.filter(r=>r.tone==="danger").length;
  const accent = kind==="cliente" ? "#2F6E4F" : "#A13D2E";
  const accentBg = kind==="cliente" ? "var(--green-bg)" : "var(--red-bg)";
  const showForm = key==="cxc" ? App.cxcShowForm : App.cxpShowForm;
  const title = kind==="cliente" ? "Cuentas por cobrar" : "Cuentas por pagar";
  const subtitle = kind==="cliente" ? "Lo que tus clientes te deben" : "Lo que le debes a tus proveedores";

  const rowsHTML = enriched.length===0
    ? `<tr><td colspan="9" class="empty-cell">Aun no hay ${kind==="cliente"?"clientes":"proveedores"} registrados.</td></tr>`
    : enriched.map(r => {
      const abonando = App.abonoTarget && App.abonoTarget.key===key && App.abonoTarget.id===r.id;
      return `
      <tr>
        <td>${esc(r.nombre)}</td>
        <td>${esc(r.factura)||"—"}</td>
        <td>${r.fecha}</td>
        <td>${r.plazoDias}d</td>
        <td class="num" style="text-align:right">${CRC(r.monto)}</td>
        <td class="num" style="text-align:right; color:var(--muted)">${CRC(r.abonado)}</td>
        <td class="num" style="text-align:right; font-weight:600">${CRC(r.saldo)}</td>
        <td><span class="badge badge-${r.tone}">${r.label}</span></td>
        <td style="white-space:nowrap">
          ${r.saldo>0 ? `<button class="link-btn" onclick="App.toggleAbono('${key}','${r.id}')">${abonando?'Cerrar':'Abonar'}</button>` : ""}
          <button class="icon-btn" onclick="App.removeCuenta('${key}','${r.id}')">${ICONS.trash}</button>
        </td>
      </tr>
      ${abonando ? `<tr><td colspan="9" style="padding:0;">
        <div class="form-row" style="background:var(--grey-bg);">
          <span style="font-size:13px; color:var(--muted); white-space:nowrap;">Abono de ${esc(r.nombre)} — saldo ${CRC(r.saldo)}</span>
          <input class="input" id="abono-monto" style="width:130px" type="number" placeholder="Monto" value="${r.saldo}" />
          ${selectorBancoHTML('abono-banco', null, {placeholder:'Cuenta de pago...', style:'min-width:190px'})}
          <button class="add-btn" style="background:${accent}; color:#fff;" onclick="App.confirmarAbono()">${ICONS.plus} Confirmar abono</button>
        </div>
      </td></tr>` : ""}`;
    }).join("");

  return `
    ${header(title, subtitle)}
    <div class="kpi-grid">
      ${kpi("Cartera total", CRC(totalCartera))}
      ${kpi("Saldo pendiente", CRC(totalSaldo), accent)}
      ${kpi(cantVencidas>0?`Vencido (${cantVencidas})`:"Vencido", CRC(totalVencido), cantVencidas>0?"#A13D2E":null)}
    </div>
    <div class="panel">
      <div class="panel-head">
        <span class="note">${rows.length} registro${rows.length!==1?"s":""}. Las generadas desde Facturas se agregan solas.</span>
        <button class="add-btn" style="background:${accentBg}; color:${accent};" onclick="App.toggleCuentaForm('${key}')">${ICONS.plus} Nueva cuenta manual</button>
      </div>
      ${showForm ? `
      <div class="form-row">
        ${selectorEntidadHTML(key+'-ent', kind)}
        <input class="input" id="${key}-factura" style="width:105px" placeholder="No. factura" />
        <input class="input" id="${key}-fecha" style="width:145px" type="date" value="${todayISO()}" />
        <input class="input" id="${key}-plazo" style="width:90px" type="number" placeholder="Plazo dias" value="15" />
        <input class="input" id="${key}-monto" style="width:130px" type="number" placeholder="Monto" />
        <button class="add-btn" style="background:${accent}; color:#fff;" onclick="App.addCuenta('${key}')">${ICONS.plus} Agregar</button>
      </div>` : ""}
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>${kind==="cliente"?"Cliente":"Proveedor"}</th><th>Factura</th><th>Fecha</th><th>Plazo</th>
            <th style="text-align:right">Monto</th><th style="text-align:right">Abonado</th>
            <th style="text-align:right">Saldo</th><th>Estado</th><th></th>
          </tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------------- render: planillas ----------------
function renderPlanillas(pla){
  const {config, empleados} = pla;
  const calc = empleados.map(e=>{
    const diario = e.salarioMensual/30;
    const horaOrdinaria = diario/8;
    const horaExtra = horaOrdinaria * config.factorHoraExtra;
    const salarioGanado = diario*e.diasTrabajados;
    const extraGanado = horaExtra*(e.horasExtra||0);
    const bruto = salarioGanado + extraGanado;
    const ccssObrero = bruto*config.obrero;
    const neto = bruto-ccssObrero;
    const ccssPatronal = bruto*config.patronal;
    const aguinaldo = bruto*config.aguinaldo;
    return {...e, diario, horaOrdinaria, horaExtra, salarioGanado, extraGanado, bruto, ccssObrero, neto, ccssPatronal, aguinaldo};
  });
  const tot = calc.reduce((a,e)=>({
    salarioGanado:a.salarioGanado+e.salarioGanado, extraGanado:a.extraGanado+e.extraGanado, bruto:a.bruto+e.bruto,
    neto:a.neto+e.neto, ccssPatronal:a.ccssPatronal+e.ccssPatronal, aguinaldo:a.aguinaldo+e.aguinaldo,
  }), {salarioGanado:0, extraGanado:0, bruto:0, neto:0, ccssPatronal:0, aguinaldo:0});
  const rowsHTML = calc.map(e => `
    <tr>
      <td>${esc(e.nombre)}</td>
      <td class="num" style="text-align:right; color:var(--muted)">${CRC(e.horaExtra)}</td>
      <td class="num" style="text-align:right">${e.diasTrabajados}d</td>
      <td style="width:90px">
        <input class="input" style="width:80px; text-align:right;" type="number" min="0" step="0.5" value="${e.horasExtra||0}"
          onchange="App.setEmpleadoHoras('${e.id}', this.value)" />
      </td>
      <td class="num" style="text-align:right; color:var(--muted)">${CRC(e.extraGanado)}</td>
      <td class="num" style="text-align:right; font-weight:600">${CRC(e.bruto)}</td>
      <td class="num" style="text-align:right; color:var(--red)">-${CRC(e.ccssObrero)}</td>
      <td class="num" style="text-align:right; font-weight:600">${CRC(e.neto)}</td>
      <td class="num" style="text-align:right; color:var(--muted)">${CRC(e.ccssPatronal)}</td>
      <td><button class="icon-btn" onclick="App.removeEmpleado('${e.id}')">${ICONS.trash}</button></td>
    </tr>`).join("");

  return `
    ${header("Planillas","Los porcentajes de CCSS, aguinaldo y el recargo de hora extra son editables para ajustarlos si la ley cambia")}
    <div class="panel">
      <div class="panel-head"><span class="note">Porcentajes de ley</span></div>
      <div class="form-row">
        ${pctInput("CCSS obrero", config.obrero, "App.setPlaConfig('obrero', this.value)")}
        ${pctInput("Cargas sociales patronales", config.patronal, "App.setPlaConfig('patronal', this.value)")}
        ${pctInput("Provision de aguinaldo", config.aguinaldo, "App.setPlaConfig('aguinaldo', this.value)")}
        ${pctInput("Recargo por hora extra", config.factorHoraExtra, "App.setPlaConfig('factorHoraExtra', this.value)")}
      </div>
    </div>
    <div class="kpi-grid">
      ${kpi("Salario ordinario total", CRC(tot.salarioGanado))}
      ${kpi("Horas extra pagadas", CRC(tot.extraGanado), tot.extraGanado>0?"#B8860B":null)}
      ${kpi("Salario bruto total", CRC(tot.bruto))}
      ${kpi("Neto a pagar", CRC(tot.neto))}
      ${kpi("Cargas patronales", CRC(tot.ccssPatronal))}
      ${kpi("Provision aguinaldo", CRC(tot.aguinaldo))}
    </div>
    <div class="panel">
      <div class="panel-head"><span class="note">Nuevo empleado. El salario por hora se calcula como salario mensual / 30 / 8, y la hora extra paga ${(config.factorHoraExtra*100).toFixed(0)}% de esa hora</span></div>
      <div class="form-row">
        <input class="input" id="pla-nombre" placeholder="Nombre / puesto" />
        <input class="input" id="pla-salario" style="width:150px" type="number" placeholder="Salario mensual" />
        <input class="input" id="pla-dias" style="width:110px" type="number" placeholder="Dias trabajados" value="30" />
        <input class="input" id="pla-horas-extra" style="width:130px" type="number" min="0" step="0.5" placeholder="Horas extra" value="0" />
        <button class="add-btn" style="background:var(--green-bg); color:var(--green);" onclick="App.addEmpleado()">${ICONS.plus} Agregar</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nombre</th>
            <th style="text-align:right">Salario x hora extra</th>
            <th style="text-align:right">Dias trab.</th>
            <th>Horas extra</th>
            <th style="text-align:right">Extra ganado</th>
            <th style="text-align:right">Bruto</th>
            <th style="text-align:right">CCSS obrero</th>
            <th style="text-align:right">Neto</th>
            <th style="text-align:right">Cargas patronales</th>
            <th></th>
          </tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
      <div class="storage-note" style="padding:10px 18px 14px;">Las horas extra se pueden editar directamente en la tabla; el resto de la planilla se recalcula solo.</div>
    </div>
  `;
}
function pctInput(label, value, onchange){
  const v = Math.round(value*1000)/10;
  return `<div class="pct-input"><span class="lbl">${label}</span><div class="row"><input class="input" type="number" step="0.01" value="${v}" onchange="${onchange}" /><span style="font-size:13px; color:var(--muted)">%</span></div></div>`;
}

// ---------------- render: precio de venta ----------------
function renderPrecios(state){
  const {pctIndirectos, pctFijos, pctUtilidad} = state.pre;
  const productos = state.inv.productos;
  const calc = productos.map(p=>{
    const ci = p.costoUnitario*pctIndirectos, gf = p.costoUnitario*pctFijos, ut = p.costoUnitario*pctUtilidad;
    return {...p, ci, gf, ut, precioVenta: precioVentaCalculado(p, state.pre)};
  });
  const rowsHTML = calc.length===0
    ? `<tr><td colspan="6" class="empty-cell">Agrega productos desde el modulo Inventario para ver su precio de venta calculado.</td></tr>`
    : calc.map(p => `
    <tr>
      <td>${esc(p.nombre)}</td>
      <td class="num" style="text-align:right">${CRC(p.costoUnitario)}</td>

// ---------------- render: depreciacion ----------------
function renderDepreciacion(dep){
  const calc = dep.map(a=>{
    const meses = Math.min(daysBetween(a.fechaCompra, todayISO())/30, a.vidaUtilMeses);
    const mesesTranscurridos = Math.max(0, Math.floor(meses));
    const mensual = a.costoHistorico/a.vidaUtilMeses;
    const acumulada = mensual*mesesTranscurridos;
    const valorLibros = a.costoHistorico-acumulada;
    return {...a, mensual, acumulada, valorLibros};
  });
  const tot = calc.reduce((acc,a)=>({costo:acc.costo+a.costoHistorico, mensual:acc.mensual+a.mensual, libros:acc.libros+a.valorLibros}), {costo:0,mensual:0,libros:0});
  const rowsHTML = calc.map(a => `
    <tr>
      <td>${esc(a.descripcion)}<div style="font-size:11px; color:var(--faint)">${esc(a.categoria)}</div></td>
      <td class="num" style="text-align:right">${CRC(a.costoHistorico)}</td>
      <td class="num" style="text-align:right; color:var(--muted)">${CRC(a.mensual)}</td>
      <td class="num" style="text-align:right; color:var(--red)">${CRC(a.acumulada)}</td>
      <td class="num" style="text-align:right; font-weight:600">${CRC(a.valorLibros)}</td>
      <td><button class="icon-btn" onclick="App.removeActivo('${a.id}')">${ICONS.trash}</button></td>
    </tr>`).join("");

  return `
    ${header("Depreciacion","Metodo de linea recta sobre activos fijos")}
    <div class="kpi-grid">
      ${kpi("Costo historico", CRC(tot.costo))}
      ${kpi("Gasto mensual", CRC(tot.mensual))}
      ${kpi("Valor en libros", CRC(tot.libros))}
    </div>
    <div class="panel">
      <div class="form-row">
        <input class="input" id="dep-categoria" style="width:130px" placeholder="Categoria" />
        <input class="input" id="dep-descripcion" placeholder="Descripcion del activo" />
        <input class="input" id="dep-fecha" style="width:140px" type="date" value="${todayISO()}" />
        <input class="input" id="dep-vida" style="width:100px" type="number" placeholder="Vida util (meses)" value="60" />
        <input class="input" id="dep-costo" style="width:130px" type="number" placeholder="Costo historico" />
        <button class="add-btn" style="background:var(--green-bg); color:var(--green);" onclick="App.addActivo()">${ICONS.plus}</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Activo</th><th style="text-align:right">Costo</th><th style="text-align:right">Dep. mensual</th><th style="text-align:right">Acumulada</th><th style="text-align:right">Valor en libros</th><th></th></tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------------- render: mayor ----------------
function renderMayor(state){
  const cuentasDetalle = state.cat.filter(c=>c.esDetalle).sort((a,b)=>a.codigo.localeCompare(b.codigo));
  const resumenHTML = cuentasDetalle.map(c => {
    const saldo = saldoCuenta(c.id, state);
    return `<tr style="cursor:pointer;" onclick="App.verMayor('${c.id}')">
      <td class="num">${esc(c.codigo)}</td>
      <td>${esc(c.nombre)}</td>
      <td><span class="badge badge-muted">${c.tipo}</span></td>
      <td class="num" style="text-align:right; font-weight:600; ${saldo<0?'color:var(--red)':''}">${CRC(saldo)}</td>
    </tr>`;
  }).join("");

  const cuentaSel = state.cat.find(c=>c.id===App.mayorCuentaId);
  let detalleHTML = "";
  if (cuentaSel){
    const movs = [];
    state.asi.forEach(a => {
      a.detalle.forEach(l => {
        if (l.cuentaId===cuentaSel.id) movs.push({fecha:a.fecha, numero:a.numero, glosa:a.glosa, debe:l.debe, haber:l.haber});
      });
    });
    movs.sort((x,y)=> x.fecha.localeCompare(y.fecha) || x.numero.localeCompare(y.numero));
    let saldoAcum = 0;
    const filas = movs.map(m => {
      saldoAcum += cuentaSel.naturaleza==="Deudora" ? (m.debe-m.haber) : (m.haber-m.debe);
      return `<tr>
        <td>${m.fecha}</td>
        <td>${m.numero}</td>
        <td>${esc(m.glosa)}</td>
        <td class="num" style="text-align:right">${m.debe>0?CRC(m.debe):""}</td>
        <td class="num" style="text-align:right">${m.haber>0?CRC(m.haber):""}</td>
        <td class="num" style="text-align:right; font-weight:600">${CRC(saldoAcum)}</td>
      </tr>`;
    }).join("");
    detalleHTML = `
      <div class="panel">
        <div class="panel-head">
          <span class="note">Mayor de ${esc(cuentaSel.codigo)} - ${esc(cuentaSel.nombre)}</span>
          <button class="icon-btn" onclick="App.verMayor(null)" style="border:1px solid #DAD8CC; border-radius:6px; width:26px; height:26px;">${ICONS.x}</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Asiento</th><th>Glosa</th><th style="text-align:right">Debe</th><th style="text-align:right">Haber</th><th style="text-align:right">Saldo</th></tr></thead>
            <tbody>${movs.length===0?`<tr><td colspan="6" class="empty-cell">Esta cuenta no tiene movimientos todavia.</td></tr>`:filas}</tbody>
          </table>
        </div>
      </div>`;
  }

  return `
    ${header("Mayor","Saldo y movimientos por cuenta, calculados a partir del diario de asientos")}
    <div class="panel">
      <div class="panel-head"><span class="note">Click en una cuenta para ver su detalle</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Codigo</th><th>Cuenta</th><th>Tipo</th><th style="text-align:right">Saldo</th></tr></thead>
          <tbody>${resumenHTML}</tbody>
        </table>
      </div>
    </div>
    ${detalleHTML}
  `;
}

// ---------------- render: estados financieros ----------------
function renderEstados(state){
  const vista = App.efiVista || "resultados";
  const desde = App.efiDesde, hasta = App.efiHasta;
  const fechaCorte = App.efiFecha || todayISO();

  const asiPeriodo = state.asi.filter(a => (!desde || a.fecha>=desde) && (!hasta || a.fecha<=hasta));
  const asiCorte = state.asi.filter(a => a.fecha<=fechaCorte);

  const toggleHTML = `
    <div class="stmt-toggle">
      <button class="${vista==='resultados'?'active':''}" onclick="App.setEfiVista('resultados')">Estado de resultados</button>
      <button class="${vista==='situacion'?'active':''}" onclick="App.setEfiVista('situacion')">Estado de situacion financiera</button>
    </div>`;

  let bodyHTML = "";

  if (vista==="resultados"){
    const ingresos = saldosPorTipo("Ingreso", state, asiPeriodo);
    const costos = saldosPorTipo("Costo", state, asiPeriodo);
    const gastos = saldosPorTipo("Gasto", state, asiPeriodo);
    const totalIngresos = ingresos.reduce((s,x)=>s+x.saldo,0);
    const totalCostos = costos.reduce((s,x)=>s+x.saldo,0);
    const utilidadBruta = totalIngresos - totalCostos;
    const totalGastos = gastos.reduce((s,x)=>s+x.saldo,0);
    const utilidadNeta = utilidadBruta - totalGastos;
    const linea = x => `<div class="stmt-line"><span>${esc(x.cuenta.codigo)} - ${esc(x.cuenta.nombre)}</span><span class="num">${CRC(x.saldo)}</span></div>`;

    bodyHTML = `
      <div class="panel">
        <div class="panel-head">
          <span class="note">Estado de resultados (tambien llamado estado de perdidas y ganancias). Filtra por periodo, o dejalo vacio para ver todo el historico</span>
          <div style="display:flex; gap:8px;">
            <input class="input" type="date" style="width:150px" value="${desde}" onchange="App.setEfiFiltro('efiDesde', this.value)" title="Desde" />
            <input class="input" type="date" style="width:150px" value="${hasta}" onchange="App.setEfiFiltro('efiHasta', this.value)" title="Hasta" />
          </div>
        </div>
        <div class="stmt-body">
          <div class="stmt-h">Ingresos</div>
          ${ingresos.length ? ingresos.map(linea).join("") : `<div class="stmt-empty">Sin movimientos en el periodo</div>`}
          <div class="stmt-total"><span>Total ingresos</span><span>${CRC(totalIngresos)}</span></div>

          <div class="stmt-h">Costo de ventas</div>
          ${costos.length ? costos.map(linea).join("") : `<div class="stmt-empty">Sin movimientos en el periodo</div>`}
          <div class="stmt-total"><span>Utilidad bruta</span><span>${CRC(utilidadBruta)}</span></div>

          <div class="stmt-h">Gastos</div>
          ${gastos.length ? gastos.map(linea).join("") : `<div class="stmt-empty">Sin movimientos en el periodo</div>`}
          <div class="stmt-total big"><span>Utilidad neta del periodo</span><span style="color:${utilidadNeta<0?'var(--red)':'var(--green)'}">${CRC(utilidadNeta)}</span></div>
        </div>
      </div>`;
  } else {
    const activos = saldosPorTipo("Activo", state, asiCorte);
    const pasivos = saldosPorTipo("Pasivo", state, asiCorte);
    const patrimonios = saldosPorTipo("Patrimonio", state, asiCorte);
    const totalActivo = activos.reduce((s,x)=>s+x.saldo,0);
    const totalPasivo = pasivos.reduce((s,x)=>s+x.saldo,0);
    const totalPatrimonioCuentas = patrimonios.reduce((s,x)=>s+x.saldo,0);
    const ingresosCorte = saldosPorTipo("Ingreso", state, asiCorte).reduce((s,x)=>s+x.saldo,0);
    const costosCorte = saldosPorTipo("Costo", state, asiCorte).reduce((s,x)=>s+x.saldo,0);
    const gastosCorte = saldosPorTipo("Gasto", state, asiCorte).reduce((s,x)=>s+x.saldo,0);
    const utilidadEjercicio = ingresosCorte - costosCorte - gastosCorte;
    const totalPatrimonio = totalPatrimonioCuentas + utilidadEjercicio;
    const totalPasivoPatrimonio = totalPasivo + totalPatrimonio;
    const diferencia = Math.round((totalActivo - totalPasivoPatrimonio)*100)/100;
    const linea = x => `<div class="stmt-line"><span>${esc(x.cuenta.codigo)} - ${esc(x.cuenta.nombre)}</span><span class="num">${CRC(x.saldo)}</span></div>`;

    bodyHTML = `
      <div class="panel">
        <div class="panel-head">
          <span class="note">Estado de situacion financiera (balance general), a una fecha de corte</span>
          <input class="input" type="date" style="width:150px" value="${fechaCorte}" onchange="App.setEfiFiltro('efiFecha', this.value)" title="A fecha" />
        </div>
        <div class="stmt-body">
          <div class="stmt-h">Activo</div>
          ${activos.length ? activos.map(linea).join("") : `<div class="stmt-empty">Sin movimientos</div>`}
          <div class="stmt-total"><span>Total activo</span><span>${CRC(totalActivo)}</span></div>

          <div class="stmt-h">Pasivo</div>
          ${pasivos.length ? pasivos.map(linea).join("") : `<div class="stmt-empty">Sin movimientos</div>`}
          <div class="stmt-total"><span>Total pasivo</span><span>${CRC(totalPasivo)}</span></div>

          <div class="stmt-h">Patrimonio</div>
          ${patrimonios.length ? patrimonios.map(linea).join("") : `<div class="stmt-empty">Sin movimientos</div>`}
          <div class="stmt-line"><span>Utilidad del ejercicio (acumulada a la fecha)</span><span class="num">${CRC(utilidadEjercicio)}</span></div>
          <div class="stmt-total"><span>Total patrimonio</span><span>${CRC(totalPatrimonio)}</span></div>

          <div class="stmt-total big"><span>Total pasivo + patrimonio</span><span>${CRC(totalPasivoPatrimonio)}</span></div>
        </div>
      </div>
      <div class="panel" style="padding:14px 18px; ${Math.abs(diferencia)<1 ? '' : 'border-color:var(--red);'}">
        ${Math.abs(diferencia)<1
          ? `<span style="color:var(--green); font-weight:600;">✓ El balance cuadra: Activo = Pasivo + Patrimonio</span>`
          : `<span style="color:var(--red); font-weight:600;">⚠ El balance no cuadra. Diferencia: ${CRC(diferencia)}. Revisa que todos los asientos esten bien clasificados en el catalogo (Activo/Pasivo/Patrimonio/Ingreso/Costo/Gasto).</span>`}
      </div>`;
  }

  return `
    ${header("Estados financieros","Calculados automaticamente a partir del diario de asientos")}
    <div class="panel">${toggleHTML}<div style="height:14px;"></div></div>
    ${bodyHTML}
  `;
}

function facturaItemRowHTML(idx, state, tipo){
  return `
    <div class="fact-item-row" id="fitem-${idx}" data-idx="${idx}">
      <input class="input" id="fitem-nombre-${idx}" list="productos-datalist" placeholder="Producto" oninput="onFacturaItemInput(${idx})" />
      <input class="input qty" id="fitem-cant-${idx}" type="number" placeholder="Cantidad" oninput="onFacturaItemInput(${idx})" />
      <input class="input price" id="fitem-precio-${idx}" type="number" placeholder="${tipo==='venta'?'Precio venta':'Costo unitario'}" oninput="onFacturaItemInput(${idx})" />
      <span class="sub num" id="fitem-sub-${idx}">₡0</span>
      <span class="hint" id="fitem-hint-${idx}"></span>
      <button class="icon-btn" onclick="App.removeFacturaItem(${idx})">${ICONS.trash}</button>
    </div>`;
}
function onFacturaItemInput(idx){
  const nombre = (document.getElementById("fitem-nombre-"+idx).value||"").trim();
  const cant = Number(document.getElementById("fitem-cant-"+idx).value)||0;
  const precioInput = document.getElementById("fitem-precio-"+idx);
  const hintEl = document.getElementById("fitem-hint-"+idx);
  if (App.facturaTipo==="venta" && nombre){
    const prod = App.state.inv.productos.find(p=>p.nombre.toLowerCase()===nombre.toLowerCase());
    if (prod){
      hintEl.textContent = "stock: "+prod.existencia;
      hintEl.style.color = prod.existencia>=cant ? "#2F6E4F" : "#A13D2E";
      if (precioInput && !precioInput.value){
        precioInput.value = Math.round(precioVentaCalculado(prod, App.state.pre));
      }
    } else {
      hintEl.textContent = "nuevo"; hintEl.style.color = "#B8860B";
    }
  } else if (hintEl){ hintEl.textContent = ""; }
  const precio = Number(precioInput.value)||0;
  document.getElementById("fitem-sub-"+idx).textContent = CRC(cant*precio);
  updateFacturaTotals();
}
function updateFacturaTotals(){
  let subtotal = 0;
  document.querySelectorAll("#factura-items .fact-item-row").forEach(row=>{
    const idx = row.dataset.idx;
    const cant = Number(document.getElementById("fitem-cant-"+idx).value)||0;
    const precio = Number(document.getElementById("fitem-precio-"+idx).value)||0;
    subtotal += cant*precio;
  });
  const incluirIva = document.getElementById("fac-iva")?.checked;
  const iva = incluirIva ? subtotal*0.13 : 0;
  const total = subtotal + iva;
  const subEl = document.getElementById("fac-subtotal"), ivaEl = document.getElementById("fac-iva-total"), totEl = document.getElementById("fac-total");
  if (subEl) subEl.textContent = CRC(subtotal);
  if (ivaEl) ivaEl.textContent = CRC(iva);
  if (totEl) totEl.textContent = CRC(total);
}
function wireFacturaLiveUpdates(){
  const ivaCheckbox = document.getElementById("fac-iva");
  if (ivaCheckbox) ivaCheckbox.addEventListener("change", updateFacturaTotals);
  const condicionSel = document.getElementById("fac-condicion");
  if (condicionSel) condicionSel.addEventListener("change", () => App.render());
  updateFacturaTotals();
}

// ---------------- respaldo a Excel ----------------
function exportarRespaldoExcel(){
  if (typeof XLSX === "undefined"){
    alert("No se pudo cargar la libreria de Excel (se necesita conexion a internet la primera vez). Verifica tu conexion e intenta de nuevo.");
    return;
  }
  const state = App.state;
  const wb = XLSX.utils.book_new();
  const addSheet = (name, rows) => {
    const ws = XLSX.utils.json_to_sheet(rows && rows.length ? rows : [{"Sin datos":""}]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  };

  addSheet("Clientes", state.cli.map(c => ({
    Nombre:c.nombre, Identificacion:c.identificacion||"", Telefono:c.telefono||"", Correo:c.email||"",
    "Cuenta contable": cuentaLabel(c.cuentaId),
  })));

  addSheet("Proveedores", state.prov.map(p => ({
    Nombre:p.nombre, Identificacion:p.identificacion||"", Telefono:p.telefono||"", Correo:p.email||"",
    "Cuenta contable": cuentaLabel(p.cuentaId),
  })));

  addSheet("Facturas", state.fac.map(f => ({
    Numero:f.numero, Tipo:f.tipo==="venta"?"Venta":"Compra", Contraparte:f.contraparte, Identificacion:f.identificacion||"",
    Fecha:f.fecha, Condicion:f.condicion==="contado"?"Contado":"Credito", "Plazo dias":f.plazoDias||0,
    "Incluye IVA":f.incluirIva?"Si":"No", Subtotal:Math.round(f.subtotal), IVA:Math.round(f.iva), Total:Math.round(f.total),
  })));

  const facDetalle = [];
  state.fac.forEach(f => (f.items||[]).forEach(it => facDetalle.push({
    Factura:f.numero, Tipo:f.tipo==="venta"?"Venta":"Compra", Fecha:f.fecha, Producto:it.nombre,
    Cantidad:it.cantidad, "Precio unitario":Math.round(it.precioUnitario), Subtotal:Math.round(it.subtotal),
  })));
  addSheet("Facturas - Detalle", facDetalle);

  addSheet("Cuentas por cobrar", state.cxc.map(r => ({
    Cliente:r.nombre, Identificacion:r.identificacion||"", Factura:r.factura||"", Fecha:r.fecha, "Plazo dias":r.plazoDias||0,
    Monto:Math.round(r.monto), Abonado:Math.round(r.abonado||0), Saldo:Math.round(r.monto-(r.abonado||0)),
    "Cuenta contable": cuentaLabel(r.cuentaId),
  })));

  addSheet("Cuentas por pagar", state.cxp.map(r => ({
    Proveedor:r.nombre, Identificacion:r.identificacion||"", Factura:r.factura||"", Fecha:r.fecha, "Plazo dias":r.plazoDias||0,
    Monto:Math.round(r.monto), Abonado:Math.round(r.abonado||0), Saldo:Math.round(r.monto-(r.abonado||0)),
    "Cuenta contable": cuentaLabel(r.cuentaId),
  })));

  addSheet("Inventario", state.inv.productos.map(p => ({
    Codigo:p.codigo, Producto:p.nombre, Existencia:p.existencia, "Costo unitario":Math.round(p.costoUnitario),
    "Valor total":Math.round(p.existencia*p.costoUnitario),
    "Precio de venta sugerido": Math.round(precioVentaCalculado(p, state.pre)),
    "Cuenta inventario": cuentaLabel(p.cuentaInventarioId), "Cuenta venta": cuentaLabel(p.cuentaVentaId), "Cuenta costo": cuentaLabel(p.cuentaCostoId),
  })));

  addSheet("Movimientos inventario", state.inv.movimientos.map(m => ({
    Fecha:m.fecha, Producto:m.producto, Tipo:m.tipo==="entrada"?"Entrada":"Salida", Cantidad:m.cantidad,
    "Costo unitario":Math.round(m.costoUnitario), Factura:m.factura||"", Proveedor:m.proveedor||"",
  })));

  const cfgPla = state.pla.config;
  addSheet("Planillas", state.pla.empleados.map(e => {
    const diario = e.salarioMensual/30, horaOrd = diario/8, horaExtra = horaOrd*cfgPla.factorHoraExtra;
    const salarioGanado = diario*e.diasTrabajados, extraGanado = horaExtra*(e.horasExtra||0);
    const bruto = salarioGanado+extraGanado, ccssObrero = bruto*cfgPla.obrero, neto = bruto-ccssObrero;
    const ccssPatronal = bruto*cfgPla.patronal, aguinaldo = bruto*cfgPla.aguinaldo;
    return {
      Nombre:e.nombre, "Salario mensual":e.salarioMensual, "Dias trabajados":e.diasTrabajados, "Horas extra":e.horasExtra||0,
      "Salario diario":Math.round(diario), "Salario x hora":Math.round(horaOrd), "Salario x hora extra":Math.round(horaExtra),
      "Salario ganado":Math.round(salarioGanado), "Extra ganado":Math.round(extraGanado), "Salario bruto":Math.round(bruto),
      "CCSS obrero":Math.round(ccssObrero), "Salario neto":Math.round(neto), "CCSS patronal":Math.round(ccssPatronal), "Aguinaldo":Math.round(aguinaldo),
    };
  }));

  addSheet("Precio de venta", state.inv.productos.map(p => ({
    Producto:p.nombre, Costo:Math.round(p.costoUnitario),
    "+Indirectos": Math.round(p.costoUnitario*state.pre.pctIndirectos),
    "+Fijos": Math.round(p.costoUnitario*state.pre.pctFijos),
    "+Utilidad": Math.round(p.costoUnitario*state.pre.pctUtilidad),
    "Precio de venta": Math.round(precioVentaCalculado(p, state.pre)),
  })));

  addSheet("Depreciacion", state.dep.map(a => {
    const meses = Math.min(daysBetween(a.fechaCompra, todayISO())/30, a.vidaUtilMeses);
    const mesesTranscurridos = Math.max(0, Math.floor(meses));
    const mensual = a.costoHistorico/a.vidaUtilMeses;
    const acumulada = mensual*mesesTranscurridos;
    return {
      Categoria:a.categoria, Descripcion:a.descripcion, "Fecha compra":a.fechaCompra, "Vida util (meses)":a.vidaUtilMeses,
      "Costo historico":Math.round(a.costoHistorico), "Depreciacion mensual":Math.round(mensual),
      "Depreciacion acumulada":Math.round(acumulada), "Valor en libros":Math.round(a.costoHistorico-acumulada),
    };
  }));

  addSheet("Catalogo de cuentas", [...state.cat].sort((a,b)=>a.codigo.localeCompare(b.codigo)).map(c => ({
    Codigo:c.codigo, Nombre:c.nombre, Tipo:c.tipo, Naturaleza:c.naturaleza,
    "Cuenta padre": c.padreId ? cuentaLabel(c.padreId) : "", Nivel: c.esDetalle?"Detalle":"Mayor",
  })));

  addSheet("Bancos", state.ban.map(b => ({
    Nombre:b.nombre, Tipo:b.tipo, "No. cuenta":b.numeroCuenta||"", "Cuenta contable": cuentaLabel(b.cuentaId),
    "Saldo inicial":Math.round(b.saldoInicial||0), "Saldo actual":Math.round(saldoBanco(b, state)),
  })));

  const asiDetalle = [];
  state.asi.forEach(a => a.detalle.forEach(l => asiDetalle.push({
    Numero:a.numero, Fecha:a.fecha, Origen:a.origen, Referencia:a.referencia||"", Glosa:a.glosa,
    Tipo:a.tipo==="automatico"?"Automatico":"Manual", Cuenta: cuentaLabel(l.cuentaId),
    Debe: l.debe>0?Math.round(l.debe):"", Haber: l.haber>0?Math.round(l.haber):"",
  })));
  addSheet("Asientos contables", asiDetalle);

  const efiRows = [];
  const bloque = (titulo, tipo) => {
    efiRows.push({Seccion:titulo, Cuenta:"", Monto:""});
    const items = saldosPorTipo(tipo, state, state.asi);
    let total = 0;
    items.forEach(x => { efiRows.push({Seccion:"", Cuenta:`${x.cuenta.codigo} - ${x.cuenta.nombre}`, Monto:Math.round(x.saldo)}); total += x.saldo; });
    efiRows.push({Seccion:`Total ${titulo.toLowerCase()}`, Cuenta:"", Monto:Math.round(total)});
    efiRows.push({Seccion:"", Cuenta:"", Monto:""});
    return total;
  };
  const totIngresos = bloque("Ingresos", "Ingreso");
  const totCostos = bloque("Costo de ventas", "Costo");
  efiRows.push({Seccion:"Utilidad bruta", Cuenta:"", Monto:Math.round(totIngresos-totCostos)});
  efiRows.push({Seccion:"", Cuenta:"", Monto:""});
  const totGastos = bloque("Gastos", "Gasto");
  const utilidadNeta = totIngresos-totCostos-totGastos;
  efiRows.push({Seccion:"Utilidad neta (historico completo)", Cuenta:"", Monto:Math.round(utilidadNeta)});
  efiRows.push({Seccion:"", Cuenta:"", Monto:""});
  const totActivo = bloque("Activo", "Activo");
  const totPasivo = bloque("Pasivo", "Pasivo");
  const totPatrimonioCuentas = bloque("Patrimonio", "Patrimonio");
  efiRows.push({Seccion:"Utilidad del ejercicio", Cuenta:"", Monto:Math.round(utilidadNeta)});
  efiRows.push({Seccion:"Total patrimonio", Cuenta:"", Monto:Math.round(totPatrimonioCuentas+utilidadNeta)});
  efiRows.push({Seccion:"Total pasivo + patrimonio", Cuenta:"", Monto:Math.round(totPasivo+totPatrimonioCuentas+utilidadNeta)});
  efiRows.push({Seccion:"Total activo", Cuenta:"", Monto:Math.round(totActivo)});
  addSheet("Estados financieros", efiRows);

  const fecha = todayISO();
  XLSX.writeFile(wb, `ContaPyme_Respaldo_${fecha}.xlsx`);
}

// ---------------- arranque ----------------
App.init();
</script>
</body>
</html>
